[project]
name = "tasteshift-agent-spike"
version = "0.1.0"
description = "Offline validation of a typed TasteShift agent runtime."
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic-ai-slim>=1,<2"]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.9,<1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
