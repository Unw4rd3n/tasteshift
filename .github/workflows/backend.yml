name: Backend
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tasteshift
          POSTGRES_PASSWORD: tasteshift
          POSTGRES_DB: tasteshift_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tasteshift"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+asyncpg://tasteshift:tasteshift@localhost:5432/tasteshift_test
      TEST_DATABASE_URL: postgresql+asyncpg://tasteshift:tasteshift@localhost:5432/tasteshift_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --python 3.12
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run alembic upgrade head
      - run: uv run alembic check
      - run: uv run pytest -q
